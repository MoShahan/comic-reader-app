# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      expo-sdk:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
      react-navigation:
        patterns:
          - '@react-navigation/*'
      eslint-stack:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
      testing:
        patterns:
          - 'jest'
          - 'jest-*'
          - '@types/jest'
          - 'babel-preset-expo'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
